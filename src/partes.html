<style id="page-rule">

    background: #525659;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    color: #000;
  }

  /* TOOLBAR NO PRINT */
  .toolbar-wrapper {
    position: sticky;
    top: 0;
    z-index: 999;
    background: #1e293b;
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .toolbar-main {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid #334155;
  }
  .toolbar-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    margin-right: auto;
  }
  .toolbar-title .badge {
    background: #4f46e5;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .btn {
    padding: 5px 11px;
    font-size: 0.76rem;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
    text-decoration: none;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-warning { background: #d97706; color: #fff; }
  .btn-secondary { background: #475569; color: #fff; }
  .btn-accent { background: #7c3aed; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid #94a3b8; color: #f1f5f9; }

  .toolbar-sub {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 6px 14px;
    background: #0f172a;
    font-size: 0.74rem;
    color: #cbd5e1;
  }
  .toolbar-sub label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .toolbar-sub input[type="number"] {
    width: 48px;
    padding: 2px 4px;
    border-radius: 3px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #fff;
    font-size: 0.74rem;
    text-align: center;
  }
  .toolbar-sub select {
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #fff;
    font-size: 0.74rem;
  }
  .stat-highlight {
    color: #facc15;
    font-weight: 700;
  }

  /* CONTENEDOR DE HOJAS */
  #hojas-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding: 15px 10px 40px;
  }

  /* HOJA A4 BASE */
  .hoja-a4 {
    background: #fff;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    position: relative;
    box-sizing: border-box;
  }

  /* MODO DOS: 2 Partes por hoja A4 Horizontal */
  .hoja-a4.modo-dos {
    width: 297mm;
    height: 209mm;
    max-height: 209mm;
    padding: 4mm 6mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 5mm;
    page-break-after: always;
    overflow: hidden;
  }

  /* MODO UNA: 1 Parte por hoja A4 Vertical */
  .hoja-a4.modo-una {
    width: 210mm;
    height: 296mm;
    max-height: 296mm;
    padding: 10mm 12mm;
    page-break-after: always;
    overflow: hidden;
  }

  /* LÍNEA DE CORTE EN MODO DOS */
  .cut-divider {
    position: absolute;
    top: 3mm;
    bottom: 3mm;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    border-left: 1px dashed #777;
    pointer-events: none;
    z-index: 10;
  }
  .cut-scissor {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 2px;
    font-size: 9pt;
    color: #555;
    line-height: 1;
  }

  /* FORMATO FÍSICO DEL PARTE */
  .parte-box {
    display: flex;
    flex-direction: column;
    height: 100%;
    border: 1px solid #111;
    padding: 2.5mm 3.5mm;
    background: #fff;
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* BARRA SUPERIOR DE ACCIONES POR PARTE (OCULTA AL IMPRIMIR) */
  .card-quick-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    padding: 2px 6px;
    margin-bottom: 2mm;
    font-size: 6.8pt;
  }
  .card-quick-actions span {
    font-weight: 700;
    color: #1e293b;
  }
  .card-quick-actions .btn-mini {
    padding: 1px 5px;
    font-size: 6.2pt;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid #94a3b8;
    background: #fff;
    color: #334155;
  }
  .card-quick-actions .btn-mini:hover {
    background: #e2e8f0;
  }

  /* TÍTULO / PASTILLA OFICIAL */
  .pf-title-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 1.5mm;
  }
  .pf-title-badge {
    display: inline-block;
    border: 1.5px solid #000;
    border-radius: 5px;
    padding: 1.5px 12px;
    box-shadow: 2px 2px 0px rgba(0,0,0,0.6);
    font-weight: 900;
    font-size: 8.5pt;
    letter-spacing: 0.8px;
    background: #fff;
    text-transform: uppercase;
  }
  .pf-num-indicator {
    margin-left: auto;
    font-size: 7pt;
    font-weight: 700;
    color: #333;
  }

  /* INPUTS EDITABLES EN EL DOCUMENTO */
  .doc-inp {
    border: 1px solid transparent;
    border-bottom: 1px dotted #888;
    background: transparent;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    color: #000;
    padding: 0.5px 2px;
    outline: none;
    transition: all 0.15s ease;
  }
  .doc-inp:hover {
    border-color: #3b82f6;
    background: rgba(239, 246, 255, 0.6);
  }
  .doc-inp:focus {
    border-color: #2563eb;
    background: #eff6ff;
    border-bottom-style: solid;
    box-shadow: 0 0 0 1px #2563eb;
  }

  /* SECCIÓN CABECERA */

    border: 1px solid #000;
    padding: 2px 4px;
    margin-bottom: 1.5mm;
    font-size: 6.8pt;
    line-height: 1.35;

    align-items: center;
    gap: 4px;
    margin-bottom: 1px;
  }
  .pf-header-row:last-child {
    margin-bottom: 0;
  }
  .pf-lbl {
    font-weight: 700;
    white-space: nowrap;
    text-transform: uppercase;
  }

    font-size: 6.5pt;
    margin-bottom: 1.5mm;
  }

    border: 1px solid #000;
    padding: 1.2px 2px;
    text-align: center;
    vertical-align: middle;
  }
  table.pf-tbl th {
    background: #e5e5e5;
    font-weight: 700;
    text-transform: uppercase;
  }
  table.pf-tbl td input.cell-inp {
    width: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-family: inherit;
    font-size: 6.5pt;
    font-weight: inherit;
    padding: 0;
    margin: 0;
    outline: none;

  }
  table.pf-tbl td input.cell-inp:focus {
    background: #dbeafe;

    margin-bottom: 1.5mm;

    text-align: center;
    font-weight: 700;
    font-size: 7pt;

    flex-direction: column;
    gap: 1.5px;

  .pf-obra-line {
    font-size: 6.2pt;
    font-weight: 600;
    color: #111;

    margin-bottom: 2mm;
    background: #fff;

  .pf-trabajos-tbl {

  .pf-trabajos-tbl th.th-desc {
    text-align: center;

  .pf-trabajos-tbl td {

  .pf-trabajos-tbl tr:last-child td {

  .pf-trabajos-tbl td.td-item {
    border-right: 1px solid #000;
    text-align: center;
    font-weight: 700;
    vertical-align: middle;
  }
  .pf-trabajos-tbl td.td-desc {

  .pf-firma-linea {

    font-size: 6.4pt;
    text-transform: uppercase;
    letter-spacing: 0.3px;

  .pf-firma-nombre {
    font-size: 5.6pt;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

    .no-print, .card-quick-actions {
      display: none !important;

    body {
      background: #fff !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #hojas-container {
      padding: 0 !important;
      gap: 0 !important;
    }
    .hoja-a4 {
      box-shadow: none !important;
      border: none !important;
      margin: 0 !important;
    }
    .hoja-a4.modo-dos {
      width: 100vw !important;
      height: 100vh !important;
      page-break-after: always !important;
    }
    .hoja-a4.modo-una {
      width: 100vw !important;
      height: 100vh !important;
      page-break-after: always !important;
    }
    .doc-inp, table.pf-tbl td input.cell-inp {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    .doc-inp:focus, table.pf-tbl td input.cell-inp:focus {
      background: transparent !important;
      box-shadow: none !important;
    }
    .pf-trabajos-tbl td [contenteditable="true"] {
      background: transparent !important;
    }
  }

</head>

let partes = [];
let modoActual = 'dos';

// INICIALIZACIÓN
document.addEventListener('DOMContentLoaded', () => {
  cargarDatalistOperadores();
  cargarPartes();
});

// POBLAR DATALIST
function cargarDatalistOperadores() {
  const dl = document.getElementById('dl-operadores');
  dl.innerHTML = '';
  TRABAJADORES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.label;
    dl.appendChild(opt);
  });
}

// CARGAR PARTES (DE LOCALSTORAGE O DEFAULT)
function cargarPartes() {
  const guardado = localStorage.getItem('workea_partes_diarios_v3');
  if (guardado) {
    try {
      partes = JSON.parse(guardado);
    } catch (e) {
      partes = JSON.parse(JSON.stringify(DEFAULT_PARTES));
    }
  } else {
    partes = JSON.parse(JSON.stringify(DEFAULT_PARTES));
  }
  renderHojas();
}

// RENDERIZAR HOJAS
function renderHojas() {
  const cont = document.getElementById('hojas-container');
  cont.innerHTML = '';

  const margen = document.getElementById('inpMargen')?.value || 4;
  const corte = document.getElementById('inpCorte')?.value || 5;

  if (modoActual === 'dos') {
    // 2 partes por hoja
    for (let i = 0; i < partes.length; i += 2) {
      const p1 = partes[i];
      const p2 = partes[i + 1] || null;

      const hoja = document.createElement('div');
      hoja.className = 'hoja-a4 modo-dos';
      hoja.style.padding = `${margen}mm 6mm`;
      hoja.style.columnGap = `${corte}mm`;

      hoja.innerHTML = `
        <div class="cut-divider">
          <div class="cut-scissor">✂</div>
        </div>
        ${renderParteHTML(p1, i)}
        ${p2 ? renderParteHTML(p2, i + 1) : '<div class="parte-box" style="border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;color:#999;font-size:8pt;">Espacio Libre</div>'}
      `;
      cont.appendChild(hoja);
    }
  } else {
    // 1 parte por hoja
    partes.forEach((p, idx) => {
      const hoja = document.createElement('div');
      hoja.className = 'hoja-a4 modo-una';
      hoja.style.padding = `${margen * 2}mm 12mm`;
      hoja.innerHTML = renderParteHTML(p, idx);
      cont.appendChild(hoja);
    });
  }

  actualizarTotales();
}

// GENERAR HTML DEL PARTE CON ESTRUCTURA FÍSICA EXACTA
function renderParteHTML(p, idx) {
  // Extraer nombre limpio del operador para firma al pie
  const opNombreLimpio = p.operador ? p.operador.split(' - ')[0] : 'PERSONAL OBRERO';

  // Generar filas de trabajos
  let filasTrabajos = '';
  if (p.items && p.items.length) {
    p.items.forEach((it, itIdx) => {
      filasTrabajos += `
        <tr>
          <td class="td-item">
            <input class="cell-inp" style="font-weight:700;" value="${it.item || (itIdx + 1).toString().padStart(2, '0')}" oninput="onItemNumChange(${idx}, ${itIdx}, this.value)">
          </td>
          <td class="td-desc">
            <div contenteditable="true" onblur="onItemDescChange(${idx}, ${itIdx}, this.innerHTML)">

            <th rowspan="2" style="width: 15%;">TOTAL<br/>HORAS</th>
          </tr>
          <tr>
            <th style="width: 14%;">ENTRADA</th>
            <th style="width: 14%;">SALIDA</th>
            <th style="width: 14%;">HORAS</th>
            <th style="width: 14%;">ENTRADA</th>
            <th style="width: 14%;">SALIDA</th>
            <th style="width: 14%;">HORAS</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input class="cell-inp" value="${p.m_ini || '-'}" oninput="onCampoChange(${idx}, 'm_ini', this.value)"></td>
            <td><input class="cell-inp" value="${p.m_fin || '-'}" oninput="onCampoChange(${idx}, 'm_fin', this.value)"></td>
            <td><input class="cell-inp" style="font-weight:600;" value="${p.m_hrs || '0.00'}" oninput="onHorasChange(${idx}, 'm_hrs', this.value)"></td>
            <td><input class="cell-inp" value="${p.t_ini || '-'}" oninput="onCampoChange(${idx}, 't_ini', this.value)"></td>
            <td><input class="cell-inp" value="${p.t_fin || '-'}" oninput="onCampoChange(${idx}, 't_fin', this.value)"></td>
            <td><input class="cell-inp" style="font-weight:600;" value="${p.t_hrs || '0.00'}" oninput="onHorasChange(${idx}, 't_hrs', this.value)"></td>
            <td style="background: #f8fafc; font-weight: 700;"><input class="cell-inp" id="tot-hrs-${idx}" style="font-weight:700;" value="${p.total_hm}" oninput="onTotalHmDirectChange(${idx}, this.value)"></td>
          </tr>
        </tbody>
      </table>

      <!-- TABLA ITEM / TRABAJOS REALIZADOS (COMPACTA) -->
      <div class="pf-trabajos-wrap">
        <table class="pf-trabajos-tbl">
          <thead>
            <tr>
              <th class="th-item">ITEM</th>
              <th class="th-desc">TRABAJOS REALIZADOS</th>
            </tr>
          </thead>
          <tbody id="tbody-trabajos-${idx}">
            ${filasTrabajos}
          </tbody>
        </table>
      </div>

      <!-- SECCIÓN FIRMAS (CON ESPACIO AMPLIO) -->
      <div class="pf-firmas-box">
        <div class="pf-firma-item">
          <div class="pf-firma-space"></div>
          <div class="pf-firma-linea"></div>
          <div class="pf-firma-cargo">OPERADOR</div>
          <div class="pf-firma-nombre" id="lbl-firma-op-${idx}">${opNombreLimpio}</div>
        </div>

        <div class="pf-firma-item">
          <div class="pf-firma-space"></div>
          <div class="pf-firma-linea"></div>
          <div class="pf-firma-cargo">RESIDENTE DE OBRA</div>
          <div class="pf-firma-nombre">${p.residente || 'Arq. Luis Javier Huanca Barrantes'}</div>
        </div>

        <div class="pf-firma-item">
          <div class="pf-firma-space"></div>
          <div class="pf-firma-linea"></div>
          <div class="pf-firma-cargo">INSPECTOR DE OBRA</div>
          <div class="pf-firma-nombre">${p.inspector || 'Arq. Marco Antonio Ramirez Luque'}</div>
        </div>
      </div>
    </div>
  `;
}

// MANEJADORES DE EDICIÓN EN VIVO
function onCampoChange(idx, campo, val) {
  if (!partes[idx]) return;
  partes[idx][campo] = val;
  guardarCambiosLocal(false);
}

function onOperadorSelectChange(idx, val) {
  if (!partes[idx]) return;
  partes[idx].operador = val;
  const opNombreLimpio = val ? val.split(' - ')[0] : 'PERSONAL OBRERO';
  const lblFirma = document.getElementById(`lbl-firma-op-${idx}`);
  if (lblFirma) lblFirma.innerText = opNombreLimpio;
  guardarCambiosLocal(false);
}

function onGasolinaChange(idx, val) {
  if (!partes[idx]) return;
  partes[idx].gasolina = val;
  actualizarTotales();
  guardarCambiosLocal(false);
}

function onHorasChange(idx, campo, val) {
  if (!partes[idx]) return;
  partes[idx][campo] = val;
  const m = parseFloat(partes[idx].m_hrs) || 0;
  const t = parseFloat(partes[idx].t_hrs) || 0;
  const tot = (m + t).toFixed(2);
  partes[idx].total_hm = tot;
  partes[idx].h_tot = tot;

  const totInput = document.getElementById(`tot-hrs-${idx}`);
  if (totInput) totInput.value = tot;
  const totHm = document.getElementById(`tot-hm-${idx}`);
  if (totHm) totHm.value = tot;

  actualizarTotales();
  guardarCambiosLocal(false);
}

function onTotalHmDirectChange(idx, val) {
  if (!partes[idx]) return;
  partes[idx].total_hm = val;
  partes[idx].h_tot = val;
  actualizarTotales();
  guardarCambiosLocal(false);
}

function onHorometroChange(idx, campo, val) {
  if (!partes[idx]) return;
  partes[idx][campo] = val;
  const ini = parseFloat(partes[idx].h_ini);
  const fin = parseFloat(partes[idx].h_fin);
  if (!isNaN(ini) && !isNaN(fin) && fin >= ini) {
    const diff = (fin - ini).toFixed(2);
    partes[idx].h_tot = diff;
    partes[idx].total_hm = diff;
    const elTotHm = document.getElementById(`tot-hm-${idx}`);
    if (elTotHm) elTotHm.value = diff;
    const elTotHrs = document.getElementById(`tot-hrs-${idx}`);
    if (elTotHrs) elTotHrs.value = diff;
    actualizarTotales();
  }
  guardarCambiosLocal(false);
}

function onItemNumChange(parteIdx, itemIdx, val) {
  if (partes[parteIdx] && partes[parteIdx].items && partes[parteIdx].items[itemIdx]) {
    partes[parteIdx].items[itemIdx].item = val;
    guardarCambiosLocal(false);
  }
}

function onItemDescChange(parteIdx, itemIdx, val) {
  if (partes[parteIdx] && partes[parteIdx].items && partes[parteIdx].items[itemIdx]) {
    partes[parteIdx].items[itemIdx].texto = val;
    guardarCambiosLocal(false);
  }
}

function agregarFilaTrabajo(parteIdx) {
  if (!partes[parteIdx]) return;
  if (!partes[parteIdx].items) partes[parteIdx].items = [];
  const nextNum = (partes[parteIdx].items.length + 1).toString().padStart(2, '0');
  partes[parteIdx].items.push({
    item: nextNum,
    asiento: '',
    texto: 'Nueva actividad de vaciado / consolidación de concreto...'
  });
  renderHojas();
  guardarCambiosLocal(false);
}

// MODAL PARA SELECCIONAR OPERADOR INDIVIDUAL
function seleccionarOperadorDialog(idx) {
  let optionsHtml = '';
  TRABAJADORES.forEach(t => {
    optionsHtml += `<option value="${t.label}">${t.label}</option>`;
  });

  Swal.fire({
    title: `Seleccionar Operador (Parte N° ${partes[idx].num})`,
    html: `
      <div style="text-align: left; font-size: 0.85rem;">
        <label style="font-weight:700;display:block;margin-bottom:6px;">Buscar Obrero de Asistencia:</label>
        <select id="swal-sel-op" style="width:100%;padding:8px;font-size:0.85rem;border:1px solid #ccc;border-radius:4px;">
          ${optionsHtml}
        </select>
        <div style="margin-top:10px;">
          <label style="font-weight:700;display:block;margin-bottom:4px;">O escribir manual:</label>
          <input type="text" id="swal-inp-op" placeholder="Ej: JUAN PEREZ - OFICIAL ALBAÑIL" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;" value="${partes[idx].operador || ''}">
        </div>
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Aplicar a este Parte',
    cancelButtonText: 'Cancelar',
    didOpen: () => {
      const sel = document.getElementById('swal-sel-op');
      const inp = document.getElementById('swal-inp-op');
      sel.addEventListener('change', () => {
        inp.value = sel.value;
      });
    },
    preConfirm: () => {
      const inp = document.getElementById('swal-inp-op');
      return inp.value.trim();
    }
  }).then(res => {
    if (res.isConfirmed && res.value) {
      partes[idx].operador = res.value;
      const inpOp = document.getElementById(`inp-op-${idx}`);
      if (inpOp) inpOp.value = res.value;
      const opNombreLimpio = res.value.split(' - ')[0];
      const lblFirma = document.getElementById(`lbl-firma-op-${idx}`);
      if (lblFirma) lblFirma.innerText = opNombreLimpio;
      guardarCambiosLocal(true);
    }
  });
}

// MODAL PARA ASIGNAR OPERADOR GLOBALMENTE A TODOS LOS 14 PARTES
function abrirModalOperadorGlobal() {
  let optionsHtml = '';
  TRABAJADORES.forEach(t => {
    optionsHtml += `<option value="${t.label}">${t.label}</option>`;
  });

  Swal.fire({
    title: '👷 Asignar Operador a Todos los Partes',
    html: `
      <div style="text-align: left; font-size: 0.85rem;">
        <p style="color:#555;margin-bottom:8px;">Selecciona el obrero de la lista de asistencia que operó el equipo para asignarlo a los <strong>14 partes diarios</strong> de forma instantánea:</p>
        <select id="swal-global-op" style="width:100%;padding:8px;font-size:0.85rem;border:1px solid #ccc;border-radius:4px;">
          ${optionsHtml}
        </select>
        <div style="margin-top:10px;">
          <label style="font-weight:700;display:block;margin-bottom:4px;">O escribir nombre personalizado:</label>
          <input type="text" id="swal-custom-op" placeholder="Ej: FLORENCIO MUSAJA PEREZ - OPERARIO ALBAÑIL" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;">
        </div>
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Aplicar a los 14 Partes',
    confirmButtonColor: '#7c3aed',
    cancelButtonText: 'Cancelar',
    didOpen: () => {
      const sel = document.getElementById('swal-global-op');
      const inp = document.getElementById('swal-custom-op');
      inp.value = sel.value;
      sel.addEventListener('change', () => { inp.value = sel.value; });
    },
    preConfirm: () => {
      const inp = document.getElementById('swal-custom-op');
      return inp.value.trim();
    }
  }).then(res => {
    if (res.isConfirmed && res.value) {
      partes.forEach(p => {
        p.operador = res.value;
      });
      renderHojas();
      guardarCambiosLocal(true);
      Swal.fire({
        icon: 'success',
        title: 'Operador Asignado',
        text: `Se actualizó el operador a "${res.value}" en los ${partes.length} partes diarios.`,
        timer: 2000,
        showConfirmButton: false
      });
    }
  });
}

// ACTUALIZAR TOTALES Y ESTADÍSTICAS
function actualizarTotales() {
  let sumHm = 0;
  let sumGas = 0;

  partes.forEach(p => {
    const hm = parseFloat(p.total_hm) || 0;
    const gas = parseFloat(p.gasolina) || 0;
    sumHm += hm;
    sumGas += gas;
  });

  const elHm = document.getElementById('lblStatHoras');
  if (elHm) elHm.innerText = `${sumHm.toFixed(2)} HM`;
  const elGas = document.getElementById('lblStatGasolina');
  if (elGas) elGas.innerText = `${sumGas.toFixed(2)} Gls Gasolina`;
  const elBadge = document.getElementById('lblBadgePartes');
  if (elBadge) elBadge.innerText = `${partes.length} Partes Listos`;
}

// GUARDAR CAMBIOS
function guardarCambiosLocal(conAlerta = false) {
  try {
    localStorage.setItem('workea_partes_diarios_v3', JSON.stringify(partes));
    if (conAlerta) {
      Swal.fire({
        icon: 'success',
        title: 'Cambios Guardados',
        text: 'Los partes diarios se han guardado correctamente en tu navegador.',
        timer: 1500,
        showConfirmButton: false
      });
    }
  } catch (e) {
    console.error('Error guardando en localStorage:', e);
  }
}

// RESTABLECER ORIGINALES
function restablecerOriginales() {
  Swal.fire({
    title: '¿Restablecer 14 Partes Originales?',
    text: 'Se restablecerán los 14 partes de la vibradora a sus valores calculados originales (60 HM y 14.50 galones).',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d97706',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'Sí, restablecer',
    cancelButtonText: 'Cancelar'
  }).then(res => {
    if (res.isConfirmed) {
      partes = JSON.parse(JSON.stringify(DEFAULT_PARTES));
      localStorage.removeItem('workea_partes_diarios_v3');
      renderHojas();
      Swal.fire({
        icon: 'success',
        title: 'Restablecido',
        text: 'Se restablecieron los 14 partes originales.',
        timer: 1500,
        showConfirmButton: false
      });
    }
  });
}

// AJUSTES DE MARGEN Y ESPACIADO
function actualizarEspaciado() {
  renderHojas();
}

// CAMBIAR MODO DE VISTA
function cambiarModoVista(modo) {
  modoActual = modo;
  const pageRule = document.getElementById('page-rule');
  if (modo === 'dos') {
    pageRule.innerText = '@page { size: A4 landscape; margin: 5mm; }';
  } else {
    pageRule.innerText = '@page { size: A4 portrait; margin: 8mm; }';
  }
  renderHojas();
}

// IMPRESIÓN
function imprimirModo(modo) {
  document.getElementById('selModoVista').value = modo;
  cambiarModoVista(modo);
  setTimeout(() => {
    window.print();
  }, 250);
}
</script>
