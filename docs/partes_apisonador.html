<style id="page-rule">
  @page {
    size: A4 landscape;
    margin: 5mm 6mm;
  }
</style>

<style>
  * {
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  body {
    margin: 0;
    padding: 0;
    background: #334155;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    color: #000;
  }

  /* TOOLBAR NO PRINT */
  .toolbar-wrapper {
    position: sticky;
    top: 0;
    z-index: 999;
    background: #0f172a;
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .toolbar-main {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid #1e293b;
  }
  .toolbar-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    margin-right: auto;
  }
  .toolbar-title .badge {
    background: #4f46e5;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .btn {
    padding: 5px 12px;
    font-size: 0.76rem;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
    text-decoration: none;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-warning { background: #d97706; color: #fff; }
  .btn-secondary { background: #334155; color: #fff; }
  .btn-accent { background: #7c3aed; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid #64748b; color: #f1f5f9; }

  .toolbar-sub {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    padding: 6px 16px;
    background: #020617;
    font-size: 0.74rem;
    color: #cbd5e1;
  }
  .toolbar-sub select {
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #fff;
    font-size: 0.74rem;
  }
  .stat-highlight {
    color: #facc15;
    font-weight: 700;
  }

  /* CONTENEDOR DE HOJAS */
  #hojas-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 16px 10px 50px;
  }

  /* HOJA A4 BASE */
  .hoja-a4 {
    background: #fff;
    box-shadow: 0 6px 25px rgba(0,0,0,0.35);
    position: relative;
    box-sizing: border-box;
  }

  /* MODO DOS: 1 Hoja A4 Horizontal por día (Izquierda: ORIGINAL | Derecha: CARGO) */
  .hoja-a4.modo-dos {
    width: 297mm;
    height: 208mm;
    max-height: 208mm;
    padding: 5mm 6mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 6mm;
    page-break-after: always;
    overflow: hidden;
  }

  /* MODO UNA: 1 Parte individual por Hoja Vertical */
  .hoja-a4.modo-una {
    width: 210mm;
    height: 296mm;
    max-height: 296mm;
    padding: 10mm 12mm;
    page-break-after: always;
    overflow: hidden;
  }

  /* LÍNEA DE CORTE EN MODO DOS */
  .cut-divider {
    position: absolute;
    top: 4mm;
    bottom: 4mm;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    border-left: 1px dashed #64748b;
    pointer-events: none;
    z-index: 10;
  }
  .cut-scissor {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 2px 4px;
    font-size: 9pt;
    color: #475569;
    line-height: 1;
  }

  /* FORMATO FÍSICO DEL PARTE */
  .parte-box {
    display: flex;
    flex-direction: column;
    height: 100%;
    border: 1px solid #000;
    padding: 3mm 4mm;
    background: #fff;
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* TÍTULO / PASTILLA OFICIAL */
  .pf-title-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2mm;
  }
  .pf-title-badge {
    display: inline-block;
    border: 1.5px solid #000;
    border-radius: 5px;
    padding: 2px 14px;
    box-shadow: 2px 2px 0px rgba(0,0,0,0.6);
    font-weight: 900;
    font-size: 8.8pt;
    letter-spacing: 0.8px;
    background: #fff;
    text-transform: uppercase;
  }
  .pf-copia-tag {
    font-size: 7.2pt;
    font-weight: 800;
    letter-spacing: 0.5px;
    border: 1px solid #000;
    border-radius: 3px;
    padding: 1px 7px;
    background: #f8fafc;
  }
  .pf-copia-tag.cargo {
    background: #fef3c7;
    border-color: #b45309;
    color: #92400e;
  }
  .pf-num-indicator {
    font-size: 7.5pt;
    font-weight: 700;
    color: #111;
  }

  /* INPUTS EDITABLES EN EL DOCUMENTO (FORZADOS A MAYÚSCULAS) */
  .doc-inp {
    border: 1px solid transparent;
    border-bottom: 1px dotted #888;
    background: transparent;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    color: #000;
    padding: 1px 3px;
    outline: none;
    transition: all 0.15s ease;
    text-transform: uppercase;
  }
  .doc-inp:hover {
    border-color: #3b82f6;
    background: rgba(239, 246, 255, 0.7);
  }
  .doc-inp:focus {
    border-color: #2563eb;
    background: #eff6ff;
    border-bottom-style: solid;
    box-shadow: 0 0 0 1px #2563eb;
  }

  /* SECCIÓN CABECERA */
  .pf-header-box {
    border: 1px solid #000;
    padding: 3.5px 5px;
    margin-bottom: 2.2mm;
    font-size: 7pt;
    line-height: 1.45;
  }
  .pf-header-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 2px;
  }
  .pf-header-row:last-child {
    margin-bottom: 0;
  }
  .pf-lbl {
    font-weight: 700;
    white-space: nowrap;
    text-transform: uppercase;
  }

  /* TABLAS COMUNES */
  table.pf-tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 6.8pt;
    margin-bottom: 2.2mm;
  }
  table.pf-tbl th, table.pf-tbl td {
    border: 1px solid #000;
    padding: 2.2px 3px;
    text-align: center;
    vertical-align: middle;
  }
  table.pf-tbl th {
    background: #e8e8e8;
    font-weight: 700;
    text-transform: uppercase;
  }
  table.pf-tbl td input.cell-inp {
    width: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-family: inherit;
    font-size: 6.8pt;
    font-weight: inherit;
    padding: 0;
    margin: 0;
    outline: none;
    text-transform: uppercase;
  }
  table.pf-tbl td input.cell-inp:hover {
    background: #eff6ff;
  }
  table.pf-tbl td input.cell-inp:focus {
    background: #dbeafe;
    font-weight: 700;
  }

  /* SECCIÓN OBRA (FIJA, NO EDITABLE, 3 LÍNEAS CENTRADAS) */
  .pf-obra-wrap {
    margin-bottom: 2.2mm;
  }
  .pf-obra-title {
    text-align: center;
    font-weight: 700;
    font-size: 7.2pt;
    letter-spacing: 0.5px;
    margin-bottom: 1.5px;
    text-transform: uppercase;
  }
  .pf-obra-box {
    border: 1px solid #000;
    padding: 3px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5px;
    background: #fff;
  }
  .pf-obra-line {
    font-size: 6.2pt;
    font-weight: 700;
    color: #000;
    text-align: center;
    line-height: 1.25;
    letter-spacing: 0.2px;
  }

  /* TABLA TRABAJOS REALIZADOS (SOLO TRABAJOS, SIN ITEM) */
  .pf-trabajos-wrap {
    border: 1px solid #000;
    margin-bottom: 2.5mm;
    background: #fff;
  }
  .pf-trabajos-tbl {
    width: 100%;
    border-collapse: collapse;
  }
  .pf-trabajos-tbl th {
    border-bottom: 1px solid #000;
    background: #e8e8e8;
    font-weight: 700;
    padding: 2px 4px;
    font-size: 7pt;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .pf-trabajos-tbl td {
    padding: 3.5px 5px;
    vertical-align: top;
  }
  .pf-trabajos-content {
    font-size: 6.6pt;
    line-height: 1.35;
    text-align: justify;
    outline: none;
    min-height: 28mm;
    white-space: pre-wrap;
  }
  .pf-trabajos-content:hover {
    background: #eff6ff;
  }
  .pf-trabajos-content:focus {
    background: #dbeafe;
  }
  .pf-asiento-header {
    font-weight: 700;
    color: #0b3954;
    display: block;
    margin-top: 3px;
    margin-bottom: 1px;
  }
  .pf-asiento-header:first-child {
    margin-top: 0;
  }

  .pf-firmas-box {
    margin-top: auto;
    padding-top: 4mm;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6mm;
    align-items: flex-end;
  }
  .pf-firma-item {
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .pf-firma-space {
    height: 18mm; /* Espacio limpio para sellos y firmas físicas */
    position: relative;
  }
  .pf-firma-linea {
    border-top: 1px dotted #000;
    margin-bottom: 2px;
  }
  .pf-firma-cargo {
    font-weight: 700;
    font-size: 6.8pt;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .pf-firma-nombre {
    font-size: 6pt;
    color: #222;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ESTILOS DE IMPRESIÓN */
  @media print {
    .no-print {
      display: none !important;
    }
    body {
      background: #fff !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #hojas-container {
      padding: 0 !important;
      gap: 0 !important;
    }
    .hoja-a4 {
      box-shadow: none !important;
      border: none !important;
      margin: 0 !important;
    }
    .hoja-a4.modo-dos {
      width: 100vw !important;
      height: 100vh !important;
      page-break-after: always !important;
    }
    .hoja-a4.modo-una {
      width: 100vw !important;
      height: 100vh !important;
      page-break-after: always !important;
    }
    .doc-inp, table.pf-tbl td input.cell-inp {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    .doc-inp:focus, table.pf-tbl td input.cell-inp:focus {
      background: transparent !important;
      box-shadow: none !important;
    }
    .pf-trabajos-content {
      background: transparent !important;
    }
  }
</style>
</head>

let ordenActiva = 'OS_5494';
let partes = [];
let modoActual = 'dos';

// CONVERTIR A FORMATO TITLE CASE (SOLO LA PRIMERA LETRA DE CADA PALABRA EN MAYÚSCULA)
function toTitleCase(texto) {
  if (!texto) return '';
  return texto
    .toLowerCase()
    .split(' ')
    .filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

// INICIALIZACIÓN
document.addEventListener('DOMContentLoaded', () => {
  cargarDatalistOperadores();
  const params = new URLSearchParams(window.location.search);
  const osParam = params.get('os');
  if (osParam === '1620') ordenActiva = 'OS_1620';
  else if (osParam === '5494') ordenActiva = 'OS_5494';
  cargarPartes();
});

// POBLAR DATALIST
function cargarDatalistOperadores() {
  const dl = document.getElementById('dl-operadores');
  dl.innerHTML = '';
  TRABAJADORES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.label;
    dl.appendChild(opt);
  });
}

function cambiarOrdenServicio(nuevaOS) {
  if (nuevaOS !== 'OS_1620' && nuevaOS !== 'OS_5494') return;
  ordenActiva = nuevaOS;
  localStorage.setItem('workea_partes_apisonador_os_activa', nuevaOS);
  const sel = document.getElementById('selOrdenServicio');
  if (sel) sel.value = nuevaOS;
  actualizarHeaderOS();
  cargarPartes();
}

function actualizarHeaderOS() {
  const tit = document.getElementById('lblTituloOS');
  if (tit) {
    tit.innerText = ordenActiva === 'OS_1620'
      ? 'WORKEA - Partes Diarios de Trabajo (Apisonador - O/S 1620)'
      : 'WORKEA - Partes Diarios de Trabajo (Apisonador Bailarina - O/S 5494)';
  }
}

function getStorageKey() {
  return ordenActiva === 'OS_1620'
    ? 'workea_partes_diarios_apisonador_1620_v2'
    : 'workea_partes_diarios_apisonador_5494_v1';
}

function getDefaultPartes() {
  return ordenActiva === 'OS_1620'
    ? DEFAULT_PARTES_APISONADOR_1620
    : DEFAULT_PARTES_APISONADOR_5494;
}

function validarVersionPartes(arr) {
  if (!Array.isArray(arr) || !arr.length) return false;
  if (ordenActiva === 'OS_1620') {
    return arr.length === 13 && arr[0].fecha === '07/04/2026';
  }
  return arr.length === 48 && arr[0].fecha === '03/09/2026' && arr[arr.length - 1].fecha === '31/10/2026';
}

function cargarPartes() {
  const osGuardada = localStorage.getItem('workea_partes_apisonador_os_activa');
  if (osGuardada === 'OS_1620' || osGuardada === 'OS_5494') {
    const params = new URLSearchParams(window.location.search);
    if (!params.get('os')) ordenActiva = osGuardada;
  }
  const sel = document.getElementById('selOrdenServicio');
  if (sel) sel.value = ordenActiva;
  actualizarHeaderOS();

  const sKey = getStorageKey();
  const guardado = localStorage.getItem(sKey);
  if (guardado) {
    try {
      partes = JSON.parse(guardado);
      if (!validarVersionPartes(partes)) {
        console.warn('Detectada version obsoleta de partes en cache local para ' + ordenActiva + '. Restableciendo.');
        partes = JSON.parse(JSON.stringify(getDefaultPartes()));
        localStorage.setItem(sKey, JSON.stringify(partes));
      }
      renderHojas();
      return;
    } catch (e) {}
  }

  partes = JSON.parse(JSON.stringify(getDefaultPartes()));
  localStorage.setItem(sKey, JSON.stringify(partes));
  renderHojas();
}

// RENDERIZAR HOJAS
function renderHojas() {
  const cont = document.getElementById('hojas-container');
  cont.innerHTML = '';

  if (modoActual === 'dos') {
    // Cada día tiene su propia hoja A4 horizontal:
    // Izquierda: ORIGINAL | Derecha: CARGO (ambos con los mismos datos del día)
    partes.forEach((p, idx) => {
      const hoja = document.createElement('div');
      hoja.className = 'hoja-a4 modo-dos';

      hoja.innerHTML = `
        <div class="cut-divider">
          <div class="cut-scissor">✂</div>
        </div>
        ${renderParteHTML(p, idx, 'ORIGINAL')}
        ${renderParteHTML(p, idx, 'CARGO')}
      `;
      cont.appendChild(hoja);
    });
  } else if (modoActual === 'seguidos') {
    // 2 partes seguidos por hoja A4 horizontal (sin cargo: Parte 1 + Parte 2, Parte 3 + Parte 4, ...)
    for (let i = 0; i < partes.length; i += 2) {
      const hoja = document.createElement('div');
      hoja.className = 'hoja-a4 modo-dos';

      const derHtml = (i + 1 < partes.length)
        ? renderParteHTML(partes[i + 1], i + 1, 'ORIGINAL')
        : '<div class="parte-box-vacia"></div>';

      hoja.innerHTML = `
        <div class="cut-divider">
          <div class="cut-scissor">✂</div>
        </div>
        ${renderParteHTML(partes[i], i, 'ORIGINAL')}
        ${derHtml}
      `;
      cont.appendChild(hoja);
    }
  } else {
    // 1 parte por hoja A4 vertical
    partes.forEach((p, idx) => {
      const hoja = document.createElement('div');
      hoja.className = 'hoja-a4 modo-una';
      hoja.innerHTML = renderParteHTML(p, idx, 'ORIGINAL');
      cont.appendChild(hoja);
    });
  }

  actualizarTotales();
}

          <span class="pf-lbl" style="margin-left: 6px;">FECHA:</span>
          <input class="doc-inp inp-fecha-${idx}" style="width: 75px; text-align: center; font-weight: 700;" value="${p.fecha || ''}" oninput="onCampoChange(${idx}, 'fecha', this.value)">
        </div>

        <div class="pf-header-row">
          <span class="pf-lbl">OPERADOR:</span>
          <input list="dl-operadores" class="doc-inp inp-op-field-${idx}" style="flex: 1; font-weight: 600;" value="${p.operador || 'PERSONAL OBRERO DE OBRA'}" placeholder="BUSCAR OBRERO..." onchange="onOperadorSelectChange(${idx}, this.value.toUpperCase())" oninput="onOperadorSelectChange(${idx}, this.value.toUpperCase())">
          <button class="btn btn-outline no-print" style="padding: 1px 6px; font-size: 6.5pt; color: #1e293b; border-color: #94a3b8;" onclick="seleccionarOperadorDialog(${idx})" title="Abrir catálogo de asistencia">👥 Buscar</button>

      </div>

      <!-- CONTADOR (HOROMETRO / KILOMETRAJE CON GUIONES) -->
      <table class="pf-tbl">
        <thead>
          <tr>
            <th style="width: 32%;">CONTADOR</th>
            <th style="width: 22%;">COMIENZO</th>
            <th style="width: 23%;">TERMINO</th>
            <th style="width: 23%;">TOTAL</th>

          <div class="pf-obra-line">INSTITUCIONALES EN LABORATORIO AMBIENTAL SAN AGUSTÍN DE TORATA</div>

            <td><input class="cell-inp inp-mfin-${idx}" value="${p.m_fin || '-'}" oninput="onCampoChange(${idx}, 'm_fin', this.value)"></td>

            <td><input class="cell-inp inp-tini-${idx}" value="${p.t_ini || '-'}" oninput="onCampoChange(${idx}, 't_ini', this.value)"></td>

      <!-- SECCIÓN FIRMAS (TITLE CASE: PRIMERA LETRA DE CADA PALABRA EN MAYÚSCULA) -->

          <div class="pf-firma-space"></div>
          <div class="pf-firma-linea"></div>

          <div class="pf-firma-nombre lbl-firma-op-${idx}">${opNombreFirma}</div>
        </div>

        <div class="pf-firma-item">
          <div class="pf-firma-space"></div>
          <div class="pf-firma-linea"></div>
          <div class="pf-firma-cargo">RESIDENTE DE OBRA</div>
          <div class="pf-firma-nombre">Arq. Luis Javier Huanca Barrantes</div>

        <div class="pf-firma-item">
          <div class="pf-firma-space"></div>
          <div class="pf-firma-linea"></div>

// MANEJADORES DE EDICIÓN EN VIVO (CON AUTO-SINCRONIZACIÓN ENTRE ORIGINAL Y CARGO)
function onCampoChange(idx, campo, val) {
  if (!partes[idx]) return;
  partes[idx][campo] = val;

  const classMap = {
    'unidad': `.inp-unidad-${idx}`,
    'placa': `.inp-placa-${idx}`,
    'fecha': `.inp-fecha-${idx}`,
    'residente': `.inp-residente-${idx}`,
    'vale': `.inp-vale-${idx}`,
    'm_ini': `.inp-mini-${idx}`,
    'm_fin': `.inp-mfin-${idx}`,
    't_ini': `.inp-tini-${idx}`,
    't_fin': `.inp-tfin-${idx}`
  };

  if (classMap[campo]) {
    document.querySelectorAll(classMap[campo]).forEach(el => {
      if (el !== document.activeElement) el.value = val;
    });
  }

  guardarCambiosLocal(false);
}

function onOperadorSelectChange(idx, val) {
  if (!partes[idx]) return;
  partes[idx].operador = val;
  const opNombreCrudo = val ? val.split(' - ')[0].trim() : 'Personal Obrero de Obra';
  const opNombreFirma = toTitleCase(opNombreCrudo);

  document.querySelectorAll(`.inp-op-field-${idx}`).forEach(el => {
    if (el !== document.activeElement) el.value = val;
  });

  document.querySelectorAll(`.lbl-firma-op-${idx}`).forEach(el => {
    el.innerText = opNombreFirma;
  });

  guardarCambiosLocal(false);
}

function onGasolinaChange(idx, val) {
  if (!partes[idx]) return;
  partes[idx].gasolina = val;
  document.querySelectorAll(`.inp-gas-${idx}`).forEach(el => {
    if (el !== document.activeElement) el.value = val;
  });
  actualizarTotales();
  guardarCambiosLocal(false);
}

function onHorasChange(idx, campo, val) {
  if (!partes[idx]) return;
  partes[idx][campo] = val;
  const m = parseFloat(partes[idx].m_hrs) || 0;
  const t = parseFloat(partes[idx].t_hrs) || 0;
  const tot = (m + t).toFixed(2);
  partes[idx].total_hm = tot;
  partes[idx].h_tot = tot;

  document.querySelectorAll(`.inp-tothrs-${idx}`).forEach(el => el.value = tot);
  document.querySelectorAll(`.inp-htot-${idx}`).forEach(el => el.value = tot);

  actualizarTotales();
  guardarCambiosLocal(false);
}

function onTotalHmDirectChange(idx, val) {
  if (!partes[idx]) return;
  partes[idx].total_hm = val;
  partes[idx].h_tot = val;
  document.querySelectorAll(`.inp-tothrs-${idx}`).forEach(el => {
    if (el !== document.activeElement) el.value = val;
  });
  document.querySelectorAll(`.inp-htot-${idx}`).forEach(el => {
    if (el !== document.activeElement) el.value = val;
  });
  actualizarTotales();
  guardarCambiosLocal(false);
}

function onHorometroChange(idx, campo, val) {
  if (!partes[idx]) return;
  partes[idx][campo] = val;
  const ini = parseFloat(partes[idx].h_ini);
  const fin = parseFloat(partes[idx].h_fin);
  if (!isNaN(ini) && !isNaN(fin) && fin >= ini) {
    const diff = (fin - ini).toFixed(2);
    partes[idx].h_tot = diff;
    partes[idx].total_hm = diff;
    document.querySelectorAll(`.inp-htot-${idx}`).forEach(el => el.value = diff);
    document.querySelectorAll(`.inp-tothrs-${idx}`).forEach(el => el.value = diff);
    actualizarTotales();
  }
  guardarCambiosLocal(false);
}

function onTrabajosTextoChange(idx, textoPlano) {
  if (!partes[idx]) return;
  partes[idx].trabajos_texto = textoPlano;
  guardarCambiosLocal(false);
}

// MODAL PARA SELECCIONAR OPERADOR INDIVIDUAL POR PARTE
function seleccionarOperadorDialog(idx) {
  let optionsHtml = '';
  TRABAJADORES.forEach(t => {
    optionsHtml += `<option value="${t.label}">${t.label}</option>`;
  });

  Swal.fire({
    title: `Seleccionar Operador (Parte N° ${partes[idx].num})`,
    html: `
      <div style="text-align: left; font-size: 0.85rem;">
        <label style="font-weight:700;display:block;margin-bottom:6px;">Buscar Obrero de Asistencia:</label>
        <select id="swal-sel-op" style="width:100%;padding:8px;font-size:0.85rem;border:1px solid #ccc;border-radius:4px;text-transform:uppercase;">
          ${optionsHtml}
        </select>
        <div style="margin-top:10px;">
          <label style="font-weight:700;display:block;margin-bottom:4px;">O escribir manual:</label>
          <input type="text" id="swal-inp-op" placeholder="EJ: JUAN PEREZ - OFICIAL ALBAÑIL" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;text-transform:uppercase;" value="${partes[idx].operador || ''}">
        </div>
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Aplicar a este Parte',
    cancelButtonText: 'Cancelar',
    didOpen: () => {
      const sel = document.getElementById('swal-sel-op');
      const inp = document.getElementById('swal-inp-op');
      sel.addEventListener('change', () => { inp.value = sel.value; });
    },
    preConfirm: () => {
      const inp = document.getElementById('swal-inp-op');
      return inp.value.trim().toUpperCase();
    }
  }).then(res => {
    if (res.isConfirmed && res.value) {
      onOperadorSelectChange(idx, res.value);
      guardarCambiosLocal(true);
    }
  });
}

// MODAL PARA ASIGNAR OPERADOR GLOBALMENTE (OPCIONAL)
function abrirModalOperadorGlobal() {
  let optionsHtml = '';
  TRABAJADORES.forEach(t => {
    optionsHtml += `<option value="${t.label}">${t.label}</option>`;
  });

  Swal.fire({
    title: '👷 Asignar Operador a Todos los Partes',
    html: `
      <div style="text-align: left; font-size: 0.85rem;">
        <p style="color:#555;margin-bottom:8px;">Selecciona el obrero de la lista de asistencia para asignarlo a los <strong>${partes.length} partes diarios</strong> simultáneamente:</p>
        <select id="swal-global-op" style="width:100%;padding:8px;font-size:0.85rem;border:1px solid #ccc;border-radius:4px;text-transform:uppercase;">
          ${optionsHtml}
        </select>
        <div style="margin-top:10px;">
          <label style="font-weight:700;display:block;margin-bottom:4px;">O escribir nombre personalizado:</label>
          <input type="text" id="swal-custom-op" placeholder="EJ: FLORENCIO MUSAJA PEREZ - OPERARIO ALBAÑIL" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:4px;text-transform:uppercase;">
        </div>
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: `Aplicar a los ${partes.length} Partes`,
    confirmButtonColor: '#7c3aed',
    cancelButtonText: 'Cancelar',
    didOpen: () => {
      const sel = document.getElementById('swal-global-op');
      const inp = document.getElementById('swal-custom-op');
      inp.value = sel.value;
      sel.addEventListener('change', () => { inp.value = sel.value; });
    },
    preConfirm: () => {
      const inp = document.getElementById('swal-custom-op');
      return inp.value.trim().toUpperCase();
    }
  }).then(res => {
    if (res.isConfirmed && res.value) {
      partes.forEach(p => {
        p.operador = res.value;
      });
      renderHojas();
      guardarCambiosLocal(true);
      Swal.fire({
        icon: 'success',
        title: 'Operador Asignado',
        text: `Se actualizó el operador a "${res.value}" en los ${partes.length} partes diarios.`,
        timer: 2000,
        showConfirmButton: false
      });
    }
  });
}

// ACTUALIZAR TOTALES Y ESTADÍSTICAS
function actualizarTotales() {
  let sumHm = 0;
  let sumGas = 0;

  partes.forEach(p => {
    const hm = parseFloat(p.total_hm) || 0;
    const gas = parseFloat(p.gasolina) || 0;
    sumHm += hm;
    sumGas += gas;
  });

  const elHm = document.getElementById('lblStatHoras');
  if (elHm) elHm.innerText = `${sumHm.toFixed(2)} HM`;
  const elGas = document.getElementById('lblStatGasolina');
  if (elGas) elGas.innerText = `${sumGas.toFixed(2)} Gls Gasolina`;
  const elBadge = document.getElementById('lblBadgePartes');
  if (elBadge) {
    if (modoActual === 'seguidos') {
      elBadge.innerText = `${partes.length} Partes en ${Math.ceil(partes.length / 2)} Hojas (Seguidos s/ Cargo)`;
    } else if (modoActual === 'una') {
      elBadge.innerText = `${partes.length} Partes (1 por Hoja Vertical)`;
    } else {
      elBadge.innerText = `${partes.length} Partes Listos (Original + Cargo)`;
    }
  }
}

// GUARDAR CAMBIOS
function guardarCambiosLocal(conAlerta = false) {
  try {
    localStorage.setItem(getStorageKey(), JSON.stringify(partes));
    if (conAlerta) {
      Swal.fire({
        icon: 'success',
        title: 'Cambios Guardados',
        text: 'Los partes diarios se han guardado correctamente en tu navegador.',
        timer: 1500,
        showConfirmButton: false
      });
    }
  } catch (e) {
    console.error('Error guardando en localStorage:', e);
  }
}

// RESTABLECER ORIGINALES
function restablecerOriginales() {
  const is1620 = (ordenActiva === 'OS_1620');
  const osLabel = is1620 ? 'O/S 1620' : 'O/S 5494';
  const nombreEquipo = is1620
    ? 'Apisonador O/S 1620 (13 Partes, 60.00 HM)'
    : 'Apisonador Bailarina O/S 5494 (48 Partes, 150.00 HM)';
  Swal.fire({
    title: `¿Restablecer Partes de ${osLabel}?`,
    text: `Se restablecerán los partes de ${nombreEquipo} a sus valores originales calculados.`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d97706',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'Sí, restablecer',
    cancelButtonText: 'Cancelar'
  }).then(res => {
    if (res.isConfirmed) {
      const defaultArray = getDefaultPartes();
      partes = JSON.parse(JSON.stringify(defaultArray));
      localStorage.removeItem(getStorageKey());
      renderHojas();
      Swal.fire({
        icon: 'success',
        title: 'Restablecido',
        text: `Se restablecieron los partes originales de ${osLabel}.`,
        timer: 1500,
        showConfirmButton: false
      });
    }
  });
}

// CAMBIAR MODO DE VISTA
function cambiarModoVista(modo) {
  modoActual = modo;
  const pageRule = document.getElementById('page-rule');
  if (modo === 'dos' || modo === 'seguidos') {
    pageRule.innerText = '@page { size: A4 landscape; margin: 5mm 6mm; }';
  } else {
    pageRule.innerText = '@page { size: A4 portrait; margin: 8mm 10mm; }';
  }
  renderHojas();
}

// IMPRESIÓN
function imprimirModo(modo) {
  document.getElementById('selModoVista').value = modo;
  cambiarModoVista(modo);
  setTimeout(() => {
    window.print();
  }, 250);
}
